name = "buscador-fornecedor"
type = "javascript"
account_id = ""
workers_dev = true
main = "src/index.ts"
compatibility_date = "2024-10-31"

# Cloudflare Pages configuration
pages_build_output_dir = "dist"

# Environment variables (set in Cloudflare Pages dashboard)
# For local development, create .env.local with your values
[env.development]
vars = { ENVIRONMENT = "development" }

[env.production]
vars = { ENVIRONMENT = "production" }

# Routes and redirects
[[routes]]
pattern = "example.com/*"
zone_name = "example.com"

# SPA routing: all 404s redirect to index.html for React Router
[[routes]]
pattern = "*"
custom_domain = false

# Build configuration
[build]
command = "npm run build"
cwd = "./"
watch_paths = ["src/**/*.tsx", "src/**/*.ts"]

# Build output directory
[build.upload]
dir = "dist"

# Triggers
[triggers.crons]
crons = []
