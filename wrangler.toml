name = "buscador-fornecedor"
type = "javascript"
# account_id = ""  # Set your Cloudflare account ID here
workers_dev = true
main = "src/index.ts"
compatibility_date = "2024-10-31"

# Cloudflare Pages configuration
pages_build_output_dir = "dist"

# Environment variables (set in Cloudflare Pages dashboard)
# For local development, create .env.local with your values
[env.development]
vars = { ENVIRONMENT = "development" }

[env.production]
vars = { ENVIRONMENT = "production" }

# Routes configuration
# Add your custom routes here if needed
# Example:
# [[routes]]
# pattern = "yourdomain.com/*"
# zone_name = "yourdomain.com"

# SPA routing: handled by _redirects file for Cloudflare Pages

# Build configuration
[build]
command = "npm run build"
cwd = "./"
watch_paths = ["src/**/*.tsx", "src/**/*.ts"]

# Build output directory
[build.upload]
dir = "dist"

# Triggers
[triggers.crons]
crons = []
