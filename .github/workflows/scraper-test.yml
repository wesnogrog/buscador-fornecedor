name: Scraper test

# Checks whether Google Maps answers from GitHub's servers. Runs only by hand,
# receives no secret and saves nothing (--dry-run).
on:
  workflow_dispatch:
    inputs:
      service:
        description: Service to search
        default: buffet
      region:
        description: Region to search
        default: Campinas

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: scraper
    env:
      # Uses the Chrome already on the server
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Show Chrome version
        run: google-chrome --version

      - name: Search without saving
        env:
          SERVICE: ${{ inputs.service }}
          REGION: ${{ inputs.region }}
        run: node main.js --dry-run
