name: Checks

# Cloudflare Pages builds and publishes the site by itself from the main branch.
# This workflow only checks that the code is healthy.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  checks:
    name: Type check, tests and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run type checking
        run: npx tsc --noEmit

      - name: Run tests
        run: npm run test -- --run

      - name: Build React app
        run: npm run build
