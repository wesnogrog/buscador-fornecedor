name: Scraper

# Started by the request-collection function when someone asks for a collection on the site.
# It reads what to collect from the database.
on:
  workflow_dispatch:

# Only one at a time. A run waiting replaces an older one waiting, which is safe
# because each run processes every collection pending in the database.
concurrency:
  group: scraper
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: scraper
    env:
      # Uses the Chrome already on the server
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run the requested collections
        env:
          SUPABASE_URL: https://zvsiajvvuhkxbfydmcqp.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node coletar.js
